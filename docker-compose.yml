
services:
  kafka:
    image: apache/kafka:4.3.0
    container_name: cyber-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT_INTERNAL://:29092,PLAINTEXT_EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  fastapi:
    build: .
    container_name: cyber-fastapi
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: sqlite:////app/mlflow.db
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/Users/amalchaturvedi/Desktop/Arnima_projects/cyber-threat-detection/mlruns

  kafka-init:
    image: apache/kafka:4.3.0
    container_name: cyber-kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1
        do
          echo "Waiting for Kafka..."
          sleep 2
        done

        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic security-events --partitions 3 --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic threat-predictions --partitions 3 --replication-factor 1
    restart: "no"
  

  producer:
    build: .
    container_name: cyber-producer
    command: ["python", "-m", "src.producer"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: "no"

  consumer:
    build: .
    container_name: cyber-consumer
    command: ["python", "-m", "src.consumer"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_TRACKING_URI: sqlite:////app/mlflow.db
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/Users/amalchaturvedi/Desktop/Arnima_projects/cyber-threat-detection/mlruns
    restart: unless-stopped
